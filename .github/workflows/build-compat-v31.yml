name: Build CloudKey Compatibility APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Android project
        shell: bash
        run: |
          rm -rf android
          base64 -d .ci/cloudkey-v31.b64 > /tmp/cloudkey-v31.tgz
          tar -xzf /tmp/cloudkey-v31.tgz
      - name: Build unsigned release APK
        shell: bash
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Collect signing tools
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$BT/lib/apksigner.jar"
          test -x "$BT/zipalign"
          mkdir -p signing-tools
          cp "$BT/lib/apksigner.jar" signing-tools/apksigner.jar
          cp "$BT/zipalign" signing-tools/zipalign
          chmod +x signing-tools/zipalign
      - name: Upload compatibility build
        uses: actions/upload-artifact@v4
        with:
          name: CloudKeyAdmin-Compat-v31
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/apksigner.jar
            signing-tools/zipalign
          if-no-files-found: error
