name: Build CloudKey Final V3

on:
  push:
    branches: [main]
    paths:
      - 'v3/android-project.tgz.b64'
      - '.github/workflows/build-final-v3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Android project
        shell: bash
        run: |
          base64 -d v3/android-project.tgz.b64 > /tmp/android-v3.tgz
          tar -xzf /tmp/android-v3.tgz
          test -f android/app/src/main/assets/index.html
          grep -q '__ADMIN_APP_KEY__' android/app/src/main/assets/index.html
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudKeyAdmin-V3-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
