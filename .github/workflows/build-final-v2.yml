name: Build CloudKey Final V2

on:
  push:
    branches: [main]
    paths:
      - 'final_payload/**'
      - '.github/workflows/build-final-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore final Android project
        shell: bash
        run: |
          cat final_payload/part* | base64 -d > /tmp/cloudkey-final.tar.gz
          tar -xzf /tmp/cloudkey-final.tar.gz
          test -f android/app/src/main/assets/index.html
          grep -q '__ADMIN_APP_KEY__' android/app/src/main/assets/index.html
      - name: Build release APK
        shell: bash
        run: |
          cd android
          gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudKeyAdmin-FinalV2-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
